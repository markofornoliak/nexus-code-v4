name: Import and verify NEXUS v4.1

on:
  push:
    branches: ["main"]
    paths: [".release/nexus-v4.1.retry2"]

permissions:
  contents: write
  issues: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: nexus-v41-release-import
  cancel-in-progress: false

jobs:
  import-verify-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and apply complete release patch
        run: |
          cat .release/nexus-v4.1-full.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/nexus-v4.1-full.patch
          echo "b7cf284065af59406ecc38ece56aee9fe742f0223ab171b05ea71b9c57c58248  /tmp/nexus-v4.1-full.patch" | sha256sum --check
          git apply --binary --index /tmp/nexus-v4.1-full.patch
          git rm -r .release
          git rm .github/workflows/import-v41.yml

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install, format, and verify release
        id: verify
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          set -o pipefail
          {
            echo "NODE=$(node --version)"
            echo "NPM=$(npm --version)"
            npm install
            npm audit --omit=dev
            npm run format
            npm run format:check
            npm run typecheck
            npm run lint
            npm run test
            npm run build
          } 2>&1 | tee /tmp/nexus-v41-validation.log

      - name: Record verification report
        if: success()
        run: |
          TEST_SUMMARY=$(grep -E "Tests[[:space:]]+[0-9]+ passed" /tmp/nexus-v41-validation.log | tail -1 | sed 's/^[[:space:]]*//')
          BUILD_SUMMARY=$(grep -E "Verified dist:" /tmp/nexus-v41-validation.log | tail -1)
          cat > docs/VERIFICATION_4.1.md <<EOF
          # NEXUS CODE v4.1 verification

          Verified on GitHub Actions with Node.js $(node --version) and npm $(npm --version).

          | Required command | Result |
          | --- | --- |
          | \`npm install\` | Passed |
          | \`npm run typecheck\` | Passed |
          | \`npm run lint\` | Passed with zero warnings |
          | \`npm run test\` | Passed |
          | \`npm run build\` | Passed for \`/${{ github.event.repository.name }}/\` |

          Additional release gates also passed: \`npm audit --omit=dev\`,
          \`npm run format\`, and \`npm run format:check\`.

          Test summary: ${TEST_SUMMARY:-Vitest completed successfully.}

          Build verifier: ${BUILD_SUMMARY:-Production artifact verification completed successfully.}

          The release preserves all existing lesson and task identifiers and migrates stored
          progress non-destructively from schema versions 1 through 5 to schema version 6.
          EOF

      - name: Commit verified release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release NEXUS CODE v4.1"
          git push origin HEAD:main

      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy verified release
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Open validation issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The automated NEXUS v4.1 import did not publish because a release gate failed."
            echo
            echo '```text'
            tail -c 55000 /tmp/nexus-v41-validation.log 2>/dev/null || echo "Validation log was not created."
            echo '```'
          } > /tmp/nexus-v41-issue.md
          gh issue create \
            --title "NEXUS v4.1 release validation failed" \
            --body-file /tmp/nexus-v41-issue.md
